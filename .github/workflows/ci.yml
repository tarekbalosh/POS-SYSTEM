name: POS SaaS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run NestJS Unit Tests
        run: cd apps/api && npm run test

      - name: Run Next.js Component Tests
        run: cd apps/web && npm run test

      - name: Build
        run: npm run build

      - name: Run E2E Tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
